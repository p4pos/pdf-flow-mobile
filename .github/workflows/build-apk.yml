name: Build Android APK Installer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Node Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Web Application
        run: pnpm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Initialize Capacitor Android Platform
        run: |
          npx cap add android
          npx cap sync android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Rename and Prepare APK Artifact
        run: |
          mkdir -p output_apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output_apk/PDFFlow-Android-Installer.apk

      - name: Upload APK Installer as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFFlow-Android-Installer
          path: output_apk/PDFFlow-Android-Installer.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.1.${{ github.run_number }}"
          name: "PDF Flow Mobile v1.1.${{ github.run_number }} - Android Installer"
          body: |
            ## 📱 PDF Flow Android Release v1.1.0

            ### New in this release:
            - **High-DPI Razor Sharp PDF Viewer**: Crisp rendering for mobile retina screens with dynamic Fit-to-Width and Fit-to-Page scaling.
            - **All Notes Tab Redesign**: Apple Notes & Google Keep inspired aesthetic, eliminating stacked duplicate search bars, with warm cards, color filters, and direct page jumping.
            - **Secret Vault & Hide Fix**: Resolved 3-dot menu double-inversion bug; hidden PDFs now reliably stay locked in the vault.
            - **Group Persistence Fix**: Deleted groups stay deleted permanently without unintended auto-restoration.
            - **Accurate Document Counts**: "All Documents" and group counts match strictly with the active view.
            - **High-Res Cover Generation & Custom Group Picker**: Crisp 720px thumbnails and tactile iOS/M3 group chips.

            ### Installation:
            Download the `PDFFlow-Android-Installer.apk` below and install it directly on your Android device!
          files: output_apk/PDFFlow-Android-Installer.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
