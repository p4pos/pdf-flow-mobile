name: Build Android APK Installer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Node Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Web Application
        run: pnpm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Capacitor Android Platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename and Prepare APK Artifact
        run: |
          mkdir -p output_apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output_apk/PDFFlow-Android-Installer.apk

      - name: Upload APK Installer as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFFlow-Android-Installer
          path: output_apk/PDFFlow-Android-Installer.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "PDF Flow Mobile v1.0.0 - Android Installer"
          body: |
            ## 📱 PDF Flow Android Release v1.0.0

            ### Features included:
            - **PDF Management**: Add, view, rename, and organize PDFs with local storage.
            - **Custom Covers**: Pick first-page thumbnail, upload custom images, or use 8 aesthetic gradient presets.
            - **In-Page Sticky Notes**: Add notes anchored to individual pages with color coding.
            - **Groups & Tags**: Color-coded category management.
            - **Privacy Vault**: Hide sensitive PDFs with PIN protection.
            - **Google Material 3 + Apple iOS HIG Fluid UI**.

            ### Installation:
            Download the `PDFFlow-Android-Installer.apk` below and install it directly on your Android device!
          files: output_apk/PDFFlow-Android-Installer.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
