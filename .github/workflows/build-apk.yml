name: Build Android APK Installer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Node Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Web Application
        run: pnpm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Sync Capacitor Android Platform
        run: |
          npx cap sync android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Rename and Prepare APK Artifact
        run: |
          mkdir -p output_apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output_apk/PDFFlow-Android-Installer.apk

      - name: Upload APK Installer as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFFlow-Android-Installer
          path: output_apk/PDFFlow-Android-Installer.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.1.${{ github.run_number }}"
          name: "PDF Flow Mobile v1.1.${{ github.run_number }} - Android Installer"
          body: |
            ## 📱 PDF Flow Android Release v1.1.${{ github.run_number }}

            ### What's New in This Release:
            - **Continuous Vertical Scroll Reader**: All pages scroll continuously in a vertical column with native 120Hz touch fling momentum, just like Google Drive and Adobe Acrobat.
            - **Fast-Scroll Scrubber**: Sleek floating page scrubber on the right edge with interactive touch drag and real-time page bubble indicator.
            - **Fluid Pinch-to-Zoom & 360° Free Pan**: GPU hardware-accelerated CSS pinch zooming with debounced High-DPI re-rendering. Zoom in up to 3.5x and freely pan 360° without edge clipping.
            - **Continuous vs. Single Page Toggle**: Switch between continuous scroll and single page mode with one tap.
            - **In-Page Note Badges**: In-page note pills allow you to view and edit notes directly for any page while scrolling.
            - **Persistent Keystore Signing**: Build is signed with the persistent release keystore for smooth in-place updates.
            - **Background State & Memory Retention**: Prevents app restart when switching to other apps (e.g. WhatsApp, YouTube).
            - **Native Back Button Handling**: Hardware back button navigates backwards gracefully through the app.

            ### Installation:
            Download the `PDFFlow-Android-Installer.apk` below and install it directly on your Android device!
          files: output_apk/PDFFlow-Android-Installer.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
